<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Ações</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
    }

    header {
      background: #ffffff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 500;
    }

    .container {
      padding: 24px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<header>
  <strong>Gerenciar Ações</strong>
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/profile.html">Perfil</a>
  </nav>
</header>

<div class="container" id="list"></div>

<script>
  const list = document.getElementById('list');

  function getStocks() {
    return JSON.parse(localStorage.getItem('stocks')) || [
      { symbol: 'PETR4', monitor: true },
      { symbol: 'VALE3', monitor: false },
      { symbol: 'ITUB4', monitor: true }
    ];
  }

  function saveStocks(stocks) {
    localStorage.setItem('stocks', JSON.stringify(stocks));
  }

  function render() {
    const stocks = getStocks();

    list.innerHTML = stocks.map((s, i) => `
      <div class="card">
        <strong>${s.symbol}</strong>

        <label>
          <input type="checkbox"
                 ${s.monitor ? 'checked' : ''}
                 onchange="toggle(${i})">
          Monitorar
        </label>
      </div>
    `).join('');
  }

  function toggle(index) {
    const stocks = getStocks();
    stocks[index].monitor = !stocks[index].monitor;
    saveStocks(stocks);
    render();
  }

  render();
</script>

</body>
</html>
