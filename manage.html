<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <strong>Gerenciar Ações</strong>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Perfil</a>
  </div>
</div>

<div class="container" id="list"></div>

<script src="app.js"></script>
<script>
  const list = document.getElementById('list');

  function render() {
    const stocks = getStocks();
    list.innerHTML = stocks.map((s, i) => `
      <div class="card">
        <strong>${s.symbol}</strong><br><br>
        <label>
          <input type="checkbox" ${s.monitor?'checked':''}
                 onchange="toggle(${i})">
          Monitorar
        </label>
      </div>
    `).join('');
  }

  function toggle(i) {
    const stocks = getStocks();
    stocks[i].monitor = !stocks[i].monitor;
    saveStocks(stocks);
  }

  render();
</script>

</body>
</html>
