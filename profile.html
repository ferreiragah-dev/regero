<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
    }

    header {
      background: #ffffff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 500;
    }

    .container {
      padding: 24px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
    }

    label {
      font-size: 14px;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <strong>Perfil</strong>
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/manage.html">Gerenciar</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <label>Nome</label>
    <input id="name">

    <label>Email</label>
    <input id="email">

    <button onclick="save()">Salvar</button>
  </div>
</div>

<script>
  function getUser() {
    return JSON.parse(localStorage.getItem('user')) || {
      name: 'Gabriel',
      email: 'gabriel@email.com'
    };
  }

  function saveUser(user) {
    localStorage.setItem('user', JSON.stringify(user));
  }

  const user = getUser();
  document.getElementById('name').value = user.name;
  document.getElementById('email').value = user.email;

  function save() {
    saveUser({
      name: name.value,
      email: email.value
    });
    alert('Perfil salvo');
  }
</script>

</body>
</html>
