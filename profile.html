<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Perfil</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="topbar">
  <strong>Perfil</strong>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="manage.html">Gerenciar</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <h3>Informações do Usuário</h3>

    <label>Nome</label>
    <input id="name"/>

    <label>Email</label>
    <input id="email"/>

    <button class="primary" onclick="save()">Salvar</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  const user = getUser();
  document.getElementById('name').value = user.name;
  document.getElementById('email').value = user.email;

  function save() {
    saveUser({
      name: name.value,
      email: email.value
    });
    alert('Perfil atualizado');
  }
</script>

</body>
</html>
