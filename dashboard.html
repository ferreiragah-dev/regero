<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div>Olá, <strong id="username"></strong></div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="manage.html">Gerenciar</a>
    <a href="profile.html">Perfil</a>
  </div>
</div>

<div class="container" id="board"></div>

<script src="app.js"></script>
<script>
  const user = getUser();
  document.getElementById('username').innerText = user.name;

  const board = document.getElementById('board');
  const timeframes = ['M1','M5','M15','M30','H1','D1'];

  function render() {
    const stocks = getStocks();
    board.innerHTML = stocks.map((s, i) => `
      <div class="card">
        <strong>${s.symbol}</strong>

        <div style="margin:10px 0">
          ${timeframes.map(tf => `
            <button onclick="setTF(${i},'${tf}')"
              style="margin-right:6px; ${s.tf===tf?'background:#0f172a;color:#fff':''}">
              ${tf}
            </button>
          `).join('')}
        </div>

        <label>
          <input type="checkbox" ${s.monitor?'checked':''}
                 onchange="toggle(${i})">
          Monitorar
        </label>
      </div>
    `).join('');
  }

  function toggle(i) {
    const stocks = getStocks();
    stocks[i].monitor = !stocks[i].monitor;
    saveStocks(stocks);
    render();
  }

  function setTF(i, tf) {
    const stocks = getStocks();
    stocks[i].tf = tf;
    saveStocks(stocks);
    render();
  }

  render();
</script>

</body>
</html>
