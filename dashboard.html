<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Regero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ===== BOARD ===== */
    .board {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    /* ===== CARD HEADER ===== */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol {
      font-size: 17px;
      font-weight: 600;
    }

    /* ===== TOGGLE ===== */
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      width: 36px;
      height: 20px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
    }

    .switch::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .switch.on {
      background: #16a34a;
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    /* ===== TIMEFRAMES ===== */
    .timeframes {
      display: flex;
      gap: 6px;
      margin: 10px 0 14px;
      flex-wrap: wrap;
    }

    .tf {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      color: #64748b;
      cursor: pointer;
    }

    .tf.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* ===== CONTENT ===== */
    .company {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .price {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .variation {
      font-size: 14px;
      font-weight: 500;
    }

    .up { color: #16a34a; }
    .down { color: #dc2626; }

    /* ===== DETAILS ===== */
    .details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      margin-top: 12px;
    }

    .expanded .details {
      max-height: 280px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .label {
      color: #64748b;
    }

    /* ===== EXPAND ===== */
    .expand {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .chevron {
      width: 18px;
      height: 18px;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      transform: rotate(45deg);
      transition: transform 0.25s ease;
    }

    .expanded .chevron {
      transform: rotate(-135deg);
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div>
    Olá, <strong id="username">bem-vindo</strong>
  </div>
  <div class="nav">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="manage.html">Gerenciar</a>
    <a href="profile.html">Perfil</a>
  </div>
</div>

<!-- BOARD -->
<div class="board" id="board"></div>

<script src="app.js"></script>
<script>
  const user = getUser();
  document.getElementById('username').innerText = user.name;

  let stocks = getStocks().map(s => ({
    ...s,
    tf: s.tf || 'M15',
    expanded: false,
    price: 0,
    var: 0
  }));

  const timeframes = ['M1','M5','M15','M30','H1','D1'];
  const board = document.getElementById('board');

  function render() {
    board.innerHTML = stocks.map((s, i) => `
      <div class="card ${s.expanded ? 'expanded' : ''}">
        
        <div class="card-header">
          <div class="symbol">${s.symbol}</div>
          <div class="toggle" onclick="toggleMonitor(${i})">
            <span>Monitorar</span>
            <div class="switch ${s.monitor ? 'on' : ''}"></div>
          </div>
        </div>

        <div class="timeframes">
          ${timeframes.map(tf => `
            <div class="tf ${s.tf === tf ? 'active' : ''}"
                 onclick="setTF(${i}, '${tf}')">${tf}</div>
          `).join('')}
        </div>

        <div class="company">Ação monitorada</div>

        <div class="price">R$ ${s.price.toFixed(2)}</div>

        <div class="variation ${s.var >= 0 ? 'up' : 'down'}">
          ${s.var >= 0 ? '+' : ''}${s.var}%
        </div>

        <div class="details">
          <div class="details-row"><span class="label">Timeframe</span><span>${s.tf}</span></div>
          <div class="details-row"><span class="label">Monitoramento</span><span>${s.monitor ? 'Ativo' : 'Inativo'}</span></div>
          <div class="details-row"><span class="label">Origem</span><span>Regero</span></div>
        </div>

        <div class="expand" onclick="toggleExpand(${i})">
          <div class="chevron"></div>
        </div>
      </div>
    `).join('');
  }

  function toggleMonitor(i) {
    stocks[i].monitor = !stocks[i].monitor;
    saveStocks(stocks);
    render();
  }

  function toggleExpand(i) {
    stocks[i].expanded = !stocks[i].expanded;
    render();
  }

  function setTF(i, tf) {
    stocks[i].tf = tf;
    saveStocks(stocks);
    render();
  }

  render();
</script>

</body>
</html>
