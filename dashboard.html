<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Fintech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    /* ===== TOPBAR ===== */
    .topbar {
      height: 64px;
      padding: 0 28px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .welcome {
      font-size: 16px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .btn.primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
    }

    /* ===== BOARD ===== */
    .board {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      overflow: hidden;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    /* ===== CARD HEADER ===== */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol {
      font-size: 17px;
      font-weight: 600;
    }

    /* ===== TOGGLE MONITORAR ===== */
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      width: 36px;
      height: 20px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
      transition: background 0.2s ease;
    }

    .switch::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .switch.on {
      background: #16a34a;
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    /* ===== TIMEFRAMES ===== */
    .timeframes {
      display: flex;
      gap: 6px;
      margin: 10px 0 14px;
      flex-wrap: wrap;
    }

    .tf {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      color: #64748b;
      cursor: pointer;
    }

    .tf.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    /* ===== CONTENT ===== */
    .company {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .price {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .variation {
      font-size: 14px;
      font-weight: 500;
    }

    .up { color: #16a34a; }
    .down { color: #dc2626; }

    /* ===== DETAILS ===== */
    .details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      margin-top: 12px;
    }

    .expanded .details {
      max-height: 300px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .details-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #64748b;
    }

    /* ===== EXPAND ICON ===== */
    .expand {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .chevron {
      width: 18px;
      height: 18px;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      transform: rotate(45deg);
      transition: transform 0.25s ease;
    }

    .expanded .chevron {
      transform: rotate(-135deg);
    }
  </style>
