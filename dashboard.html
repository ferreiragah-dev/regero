<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Regero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- CSS ABSOLUTO -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="topbar">
  <div>Olá, <strong id="username">bem-vindo</strong></div>
  <div class="nav">
    <a href="/profile.html">Conta</a>
    <a href="/manage.html">Monitorar</a>
  </div>
</div>

<div class="board" id="board"></div>

<script src="/app.js"></script>
<script>
  const user = getUser();
  document.getElementById('username').innerText = user.name || 'bem-vindo';

  const board = document.getElementById('board');
  const timeframes = ['M1','M5','M15','M30','H1','D1'];

  function normalize(raw) {
    return raw.map(s => ({
      symbol: s.symbol,
      name: s.name || '',
      monitor: !!s.monitor,
      tf: s.tf || 'M15',
      price: s.price || (s.symbol === 'PETR4' ? 36.12 : 69.45),
      var: s.var ?? (s.symbol === 'PETR4' ? 1.82 : -0.94),
      expanded: false
    }));
  }

  let stocks = normalize(getStocks());

  function render() {
    board.innerHTML = stocks.map((s, i) => `
      <div class="card ${s.expanded ? 'expanded' : ''}">

        <div class="card-header">
          <div>
            <div class="symbol">${s.symbol}</div>
            <div class="company">${s.name}</div>
          </div>

          <div class="toggle">
            Monitorar
            <div class="switch ${s.monitor ? 'on' : ''}"
                 onclick="toggleMonitor(${i})"></div>
          </div>
        </div>

        <div class="price">R$ ${s.price.toFixed(2)}</div>

        <div class="variation ${s.var >= 0 ? 'up' : 'down'}">
          ${s.var >= 0 ? '+' : ''}${s.var}%
        </div>

        <div class="expand" onclick="toggleExpand(${i})">
          <div class="chevron"></div>
        </div>

        <div class="details">
          <div class="timeframes">
            ${timeframes.map(tf => `
              <div class="tf ${s.tf === tf ? 'active' : ''}"
                   onclick="setTF(${i}, '${tf}')">${tf}</div>
            `).join('')}
          </div>
        </div>

      </div>
    `).join('');
  }

  function toggleMonitor(i) {
    stocks[i].monitor = !stocks[i].monitor;
    saveStocks(stocks);
    render();
  }

  function toggleExpand(i) {
    stocks[i].expanded = !stocks[i].expanded;
    render();
  }

  function setTF(i, tf) {
    stocks[i].tf = tf;
    saveStocks(stocks);
    render();
  }

  render();
</script>

</body>
</html>
