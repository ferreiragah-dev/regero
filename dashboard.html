<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Regero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="stylesheet" href="/styles.css">
<script src="/app.js"></script>


  <style>
    .board {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .symbol {
      font-size: 17px;
      font-weight: 600;
    }

    .toggle {
      font-size: 13px;
    }

    .timeframes {
      display: flex;
      gap: 6px;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .tf {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      background: #ffffff;
    }

    .tf.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .status {
      font-size: 12px;
      margin-top: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div>
    Olá, <strong id="username"></strong>
  </div>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="manage.html">Gerenciar</a>
    <a href="profile.html">Perfil</a>
  </div>
</div>

<!-- BOARD -->
<div class="board" id="board"></div>

<script src="app.js"></script>
<script>
  /* ============================
     DASHBOARD INTEGRATION
     ============================ */

  const user = getUser();
  document.getElementById('username').innerText = user.name || 'Usuário';

  const board = document.getElementById('board');
  const timeframes = ['M1','M5','M15','M30','H1','D1'];

  function renderDashboard() {
    const stocks = getStocks();

    if (!stocks.length) {
      board.innerHTML = '<p>Nenhuma ação cadastrada.</p>';
      return;
    }

    board.innerHTML = stocks.map((stock, index) => `
      <div class="card">
        
        <div class="card-header">
          <div class="symbol">${stock.symbol}</div>

          <div class="toggle">
            <label>
              <input type="checkbox"
                     ${stock.monitor ? 'checked' : ''}
                     onchange="toggleMonitor(${index})">
              Monitorar
            </label>
          </div>
        </div>

        <div class="timeframes">
          ${timeframes.map(tf => `
            <div class="tf ${stock.tf === tf ? 'active' : ''}"
                 onclick="setTimeframe(${index}, '${tf}')">
              ${tf}
            </div>
          `).join('')}
        </div>

        <div class="status">
          Timeframe selecionado: <strong>${stock.tf}</strong><br>
          Monitoramento: <strong>${stock.monitor ? 'Ativo' : 'Inativo'}</strong>
        </div>

      </div>
    `).join('');
  }

  function toggleMonitor(index) {
    const stocks = getStocks();
    stocks[index].monitor = !stocks[index].monitor;
    saveStocks(stocks);
    renderDashboard();
  }

  function setTimeframe(index, tf) {
    const stocks = getStocks();
    stocks[index].tf = tf;
    saveStocks(stocks);
    renderDashboard();
  }

  renderDashboard();
</script>

</body>
</html>
