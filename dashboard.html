<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8fafc;
      margin: 0;
    }

    header {
      background: #ffffff;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      margin-left: 12px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .board {
      padding: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 8px 0;
    }

    .up { color: #16a34a; }
    .down { color: #dc2626; }
  </style>
</head>
<body>

<header>
  <strong>Olá, <span id="username">usuário</span></strong>

  <!-- NAVEGAÇÃO FUNCIONAL -->
  <nav>
    <a href="/dashboard.html">Dashboard</a>
    <a href="/manage.html">Gerenciar</a>
    <a href="/profile.html">Perfil</a>
  </nav>
</header>

<div class="board" id="board"></div>

<script>
  /* ===== USER ===== */
  function getUser() {
    return JSON.parse(localStorage.getItem('user')) || {
      name: 'Gabriel'
    };
  }

  document.getElementById('username').innerText = getUser().name;

  /* ===== STOCKS ===== */
  function getStocks() {
    return JSON.parse(localStorage.getItem('stocks')) || [
      { symbol: 'PETR4', price: 36.12, var: 1.82 },
      { symbol: 'VALE3', price: 69.45, var: -0.94 }
    ];
  }

  const board = document.getElementById('board');
  const stocks = getStocks();

  board.innerHTML = stocks.map(s => `
    <div class="card">
      <strong>${s.symbol}</strong>

      <div class="price">
        R$ ${s.price.toFixed(2)}
      </div>

      <div class="${s.var >= 0 ? 'up' : 'down'}">
        ${s.var >= 0 ? '+' : ''}${s.var}%
      </div>
    </div>
  `).join('');
</script>

</body>
</html>
