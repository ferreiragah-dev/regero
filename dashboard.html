<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard | Regero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="/styles.css" />

  <style>
    .board {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .symbol {
      font-size: 18px;
      font-weight: 600;
    }

    .monitor {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .timeframes {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tf {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
      color: #334155;
      background: #ffffff;
    }

    .tf.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .status {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div>Olá, <strong id="username"></strong></div>
  <div class="nav">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/manage.html">Gerenciar</a>
    <a href="/profile.html">Perfil</a>
  </div>
</div>

<div class="board" id="board"></div>

<script src="/app.js"></script>
<script>
  const user = getUser();
  document.getElementById('username').innerText = user.name || 'Usuário';

  const timeframes = ['M1','M5','M15','M30','H1','D1'];
  const board = document.getElementById('board');

  function normalizeStocks(rawStocks) {
    return rawStocks.map(s => ({
      symbol: s.symbol,
      monitor: !!s.monitor,
      tf: s.tf || 'M15'
    }));
  }

  let stocks = normalizeStocks(getStocks());

  function renderDashboard() {
    board.innerHTML = stocks.map((s, i) => `
      <div class="card">

        <div class="card-header">
          <div class="symbol">${s.symbol}</div>

          <label class="monitor">
            <input type="checkbox"
                   ${s.monitor ? 'checked' : ''}
                   onchange="toggleMonitor(${i})">
            Monitorar
          </label>
        </div>

        <div class="timeframes">
          ${timeframes.map(tf => `
            <div class="tf ${s.tf === tf ? 'active' : ''}"
                 onclick="setTimeframe(${i}, '${tf}')">
              ${tf}
            </div>
          `).join('')}
        </div>

        <div class="status">
          Timeframe ativo: <strong>${s.tf}</strong><br>
          Status: <strong>${s.monitor ? 'Monitorando' : 'Desativado'}</strong>
        </div>

      </div>
    `).join('');
  }

  function toggleMonitor(index) {
    stocks[index].monitor = !stocks[index].monitor;
    saveStocks(stocks);
    renderDashboard();
  }

  function setTimeframe(index, tf) {
    stocks[index].tf = tf;
    saveStocks(stocks);
    renderDashboard();
  }

  renderDashboard();
</script>

</body>
</html>
