<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Fintech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    .topbar {
      height: 64px;
      padding: 0 28px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .welcome {
      font-size: 16px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .btn.primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
    }

    .board {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol {
      font-size: 17px;
      font-weight: 600;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .switch {
      width: 36px;
      height: 20px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
      transition: background 0.2s ease;
    }

    .switch::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
    }

    .switch.on {
      background: #16a34a;
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    .timeframes {
      display: flex;
      gap: 6px;
      margin: 10px 0 14px;
      flex-wrap: wrap;
    }

    .tf {
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
      color: #64748b;
      cursor: pointer;
    }

    .tf.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .company {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .price {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .variation {
      font-size: 14px;
      font-weight: 500;
    }

    .up { color: #16a34a; }
    .down { color: #dc2626; }

    .details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      margin-top: 12px;
    }

    .expanded .details {
      max-height: 300px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .expand {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      cursor: pointer;
    }

    .chevron {
      width: 18px;
      height: 18px;
      border-right: 2px solid #64748b;
      border-bottom: 2px solid #64748b;
      transform: rotate(45deg);
      transition: transform 0.25s ease;
    }

    .expanded .chevron {
      transform: rotate(-135deg);
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="welcome">Olá, <strong>bem-vindo</strong></div>
    <div class="actions">
      <button class="btn">Conta</button>
      <button class="btn primary">Monitorar</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <script>
    const N8N_URL = 'https://n8n.lowcodeforward.com/webhook/stocks';

    const timeframes = ['M1','M5','M15','M30','H1','D1'];
    const board = document.getElementById('board');
    let stocks = [];

    const STOCK_NAMES = {
      VALE3:'Vale', PETR4:'Petrobras PN', PETR3:'Petrobras ON',
      ITUB4:'Itaú PN', ITUB3:'Itaú ON', B3SA3:'B3',
      ABEV3:'Ambev', BBDC4:'Bradesco PN', BBDC3:'Bradesco ON',
      BBAS3:'Banco do Brasil', BBSE3:'BB Seguridade',
      WEGE3:'WEG', RADL3:'Raia Drogasil', MRFG3:'Marfrig',
      CPFE3:'CPFL Energia', EGIE3:'Engie Brasil', COGN3:'Cogna',
      UGPA3:'Ultrapar', CVCB3:'CVC', YDUQ3:'Yduqs'
    };

    async function carregarDados() {
      try {
        const res = await fetch(N8N_URL);
        const data = await res.json();

        stocks = data.map(item => {
          const existing = stocks.find(s => s.symbol === item.symbol);
          if (existing && !existing.monitor) return existing;

          const price = item.last_price ?? item.close_price ?? 0;
          const open = item.open_price ?? 0;

          const variation = open && price
            ? (((price - open) / open) * 100).toFixed(2)
            : 0;

          return {
            symbol: item.symbol,
            name: STOCK_NAMES[item.symbol] || item.symbol,
            price,
            var: Number(variation),
            open,
            high: price * 1.01,
            low: price * 0.99,
            volume: '—',
            tf: existing?.tf || 'M5',
            monitor: existing?.monitor || false,
            expanded: existing?.expanded || false
          };
        });

        render();
      } catch (e) {
        console.error('Erro ao atualizar dados', e);
      }
    }

    function render() {
      board.innerHTML = stocks.map((s, i) => `
        <div class="card ${s.expanded ? 'expanded' : ''}">
          <div class="card-header">
            <div class="symbol">${s.symbol}</div>
            <div class="toggle" onclick="toggleMonitor(${i})">
              <span>Monitorar</span>
              <div class="switch ${s.monitor ? 'on' : ''}"></div>
            </div>
          </div>

          <div class="timeframes">
            ${timeframes.map(tf => `
              <div class="tf ${s.tf === tf ? 'active' : ''}"
                   onclick="setTF(${i}, '${tf}')">${tf}</div>
            `).join('')}
          </div>

          <div class="company">${s.name}</div>
          <div class="price">R$ ${s.price.toFixed(2)}</div>

          <div class="variation ${s.var >= 0 ? 'up' : 'down'}">
            ${s.var >= 0 ? '+' : ''}${s.var}%
          </div>

          <div class="details">
            <div class="details-row"><span>Abertura</span><span>R$ ${s.open.toFixed(2)}</span></div>
            <div class="details-row"><span>Máxima</span><span>R$ ${s.high.toFixed(2)}</span></div>
            <div class="details-row"><span>Mínima</span><span>R$ ${s.low.toFixed(2)}</span></div>
            <div class="details-row"><span>Volume</span><span>${s.volume}</span></div>
          </div>

          <div class="expand" onclick="toggleExpand(${i})">
            <div class="chevron"></div>
          </div>
        </div>
      `).join('');
    }

    function toggleMonitor(i){ stocks[i].monitor=!stocks[i].monitor; render(); }
    function toggleExpand(i){ stocks[i].expanded=!stocks[i].expanded; render(); }
    function setTF(i,tf){ stocks[i].tf=tf; render(); }

    carregarDados();
    setInterval(carregarDados, 60000);
  </script>

</body>
</html>
