<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>FinTech • Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    :root {
      --primary: #6d28d9;
      --primary-dark: #5b21b6;
      --bg-light: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      background: var(--bg-light);
    }

    /* ================= LEFT SIDE ================= */
    .left {
      flex: 1;
      background: linear-gradient(135deg, #7c3aed, #9333ea, #6d28d9);
      color: #fff;
      padding: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .left::before,
    .left::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
    }

    .left::before {
      width: 420px;
      height: 420px;
      background: #fff;
      top: -120px;
      left: -120px;
    }

    .left::after {
      width: 320px;
      height: 320px;
      background: #fff;
      bottom: -100px;
      right: -100px;
    }

    .illustration {
      max-width: 420px;
      text-align: center;
      animation: float 6s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .illustration h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .illustration p {
      font-size: 16px;
      opacity: 0.9;
    }

    /* ================= RIGHT SIDE ================= */
    .right {
      flex: 1;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      animation: fadeUp 0.6s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ede9fe;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: var(--primary);
      font-size: 32px;
      font-weight: bold;
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 16px;
      position: relative;
    }

    .field input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(109, 40, 217, 0.15);
    }

    .field span {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 16px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
      color: var(--muted);
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .options a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(109, 40, 217, 0.45);
    }

    .message {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #dc2626;
    }

    /* ================= MOBILE ================= */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .left {
        min-height: 220px;
        padding: 32px;
      }

      .illustration h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

<!-- LEFT -->
<div class="left">
  <div class="illustration">
    <h1>Bem-vindo ao FinTech</h1>
    <p>Monitore suas ações em tempo real com segurança e performance.</p>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="card">
    <div class="avatar">👤</div>
    <div class="title">User Login</div>

    <form id="loginForm">
      <div class="field">
        <input type="email" id="email" placeholder="Email" required />
        <span>📧</span>
      </div>

      <div class="field">
        <input type="password" id="password" placeholder="Senha" required />
        <span>🔒</span>
      </div>

      <div class="options">
        <label>
          <input type="checkbox" />
          Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="btn">LOGIN</button>
      <div class="message" id="message"></div>
    </form>
  </div>
</div>

<script>
  const API_BASE = 'https://stock-tracker-fintech-backend.watryz.easypanel.host/api';

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const message = document.getElementById('message');
    message.textContent = '';

 const email = document.getElementById('email').value;
const password = document.getElementById('password').value;

    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro ao logar');

      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('user_id', data.user.id);

      window.location.href = '/index.html';
    } catch (err) {
      message.textContent = err.message;
    }
  });
</script>

</body>
</html>
