<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Fintech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    .topbar {
      height: 64px;
      padding: 0 28px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .welcome {
      font-size: 16px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .btn.primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
    }

    .board {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol {
      font-size: 17px;
      font-weight: 600;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      width: 36px;
      height: 20px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
    }

    .switch::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .switch.on {
      background: #16a34a;
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    .price {
      font-size: 26px;
      font-weight: 600;
      margin-top: 12px;
    }

    .variation {
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }

    .up { color: #16a34a; }
    .down { color: #dc2626; }

    .details {
      margin-top: 14px;
      font-size: 13px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .details-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="welcome">Olá, <strong>bem-vindo</strong></div>
  <div class="actions">
    <button class="btn">Conta</button>
    <button class="btn primary">Monitorar</button>
  </div>
</div>

<div class="board" id="board"></div>

<script>
const token = localStorage.getItem('access_token');

  const userId = localStorage.getItem('user_id');

  if (!userId) {
    console.warn('Usuário não autenticado, redirecionando para login');
    window.location.href = '/login.html';
  } else {
    window.USER_ID = userId;
  }

  const API_BASE_URL =
    'https://stock-tracker-fintech-backend.watryz.easypanel.host/api';

  let stocks = [];
  const board = document.getElementById('board');

  function formatPrice(v) {
    return typeof v === 'number' ? v.toFixed(2) : '--';
  }

  function formatVariation(v) {
    if (typeof v !== 'number') return '--';
    return `${v >= 0 ? '+' : ''}${v.toFixed(2)}%`;
  }

function getUserId() {
  return localStorage.getItem('user_id');
}

async function fetchDashboard() {
  const userId = getUserId();

  if (!userId) {
    window.location.href = '/login.html';
    return;
  }

  const res = await fetch(`${API_BASE_URL}/dashboard`, {
    headers: {
      'x-user-id': userId
    }
  });

  if (!res.ok) {
    throw new Error('Erro ao buscar dashboard');
  }

  return res.json();
}

  async function loadDashboard() {
    try {
      const data = await fetchDashboard();

      stocks = data.map(item => ({
        symbol: item.symbol,
        name: item.name || item.symbol,
        price: Number(item.price) || 0,
        variation: Number(item.variation) || 0,
        open: Number(item.open) || 0,
        high: Number(item.high) || 0,
        low: Number(item.low) || 0,
        monitor: Boolean(item.monitor)
      }));

      if (!stocks.length) {
        board.innerHTML = `<p style="color:#64748b">Nenhuma ação monitorada</p>`;
        return;
      }

      render();
    } catch (err) {
      console.error(err);
      board.innerHTML = `<p style="color:red">Erro ao carregar dashboard</p>`;
    }
  }

  async function refreshPrices() {
    try {
      const data = await fetchDashboard();

      data.forEach(update => {
        const stock = stocks.find(s => s.symbol === update.symbol);
        if (!stock || !stock.monitor) return;

        stock.price = Number(update.price) || stock.price;
        stock.variation = Number(update.variation) ?? stock.variation;
        stock.open = Number(update.open) || stock.open;
        stock.high = Number(update.high) || stock.high;
        stock.low = Number(update.low) || stock.low;
      });

      render();
    } catch (err) {
      console.error(err);
    }
  }

  async function toggleMonitor(index) {
    const stock = stocks[index];
    const newValue = !stock.monitor;

    try {
      await fetch(`${API_BASE_URL}/monitor`, {
        method: 'POST',
headers: {
  "Authorization": `Bearer ${localStorage.getItem("access_token")}`
}
,
        body: JSON.stringify({
          symbol: stock.symbol,
          monitor: newValue
        })
      });

      stock.monitor = newValue;
      render();
    } catch (err) {
      console.error(err);
      alert('Erro ao salvar monitoramento');
    }
  }

  function render() {
    board.innerHTML = stocks.map((s, i) => `
      <div class="card">
        <div class="card-header">
          <div class="symbol">${s.symbol}</div>
          <div class="toggle" onclick="toggleMonitor('${s.symbol}', ${s.monitor})">
            <span>Monitorar</span>
            <div class="switch ${s.monitor ? 'on' : ''}"></div>
          </div>
        </div>

        <div class="price">R$ ${formatPrice(s.price)}</div>

        <div class="variation ${s.variation >= 0 ? 'up' : 'down'}">
          ${formatVariation(s.variation)}
        </div>

        <div class="details">
          <div class="details-row"><span class="label">Abertura</span><span>R$ ${formatPrice(s.open)}</span></div>
          <div class="details-row"><span class="label">Máxima</span><span>R$ ${formatPrice(s.high)}</span></div>
          <div class="details-row"><span class="label">Mínima</span><span>R$ ${formatPrice(s.low)}</span></div>
        </div>
      </div>
    `).join('');
  }

  loadDashboard();
  setInterval(refreshPrices, 60_000);
</script>

</body>
</html>
