<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Dashboard Fintech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  background: #ffffff;
  color: #0f172a;
}

.topbar {
  height: 64px;
  padding: 0 28px;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.actions { display: flex; gap: 12px; }

.btn, .logout-btn {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid #e5e7eb;
  background: #ffffff;
}

.btn.primary {
  background: #2563eb;
  color: #ffffff;
  border: none;
}

.board {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px 24px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 18px;
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.symbol { font-weight: 600; font-size: 17px; }

.toggle {
  font-size: 11px;
  cursor: pointer;
  display: flex;
  gap: 6px;
}

.switch {
  width: 36px;
  height: 20px;
  background: #e5e7eb;
  border-radius: 999px;
  position: relative;
}

.switch::after {
  content: '';
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform .2s;
}

.switch.on { background: #16a34a; }
.switch.on::after { transform: translateX(16px); }

.price { font-size: 26px; margin-top: 12px; }
.variation { font-size: 14px; margin-top: 4px; }
.up { color: #16a34a; }
.down { color: #dc2626; }

.expand {
  margin-top: 10px;
  font-size: 12px;
  color: #2563eb;
  cursor: pointer;
}

.history {
  margin-top: 14px;
  display: none;
}

.history canvas {
  width: 100% !important;
  height: 140px !important;
}
</style>
</head>

<body>

<div class="topbar">
  <div>Olá, <strong>bem-vindo</strong></div>
  <div class="actions">
    <button class="btn primary" onclick="location.href='/stocks.html'">Monitorar</button>
    <button id="logoutBtn" class="logout-btn">Sair</button>
  </div>
</div>

<div class="board" id="board"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const API = 'https://stock-tracker-fintech-backend.watryz.easypanel.host/api';
const board = document.getElementById('board');
const userId = localStorage.getItem('user_id');
if (!userId) location.href = '/login.html';

let stocks = {};
let charts = {};

function fmt(v){ return typeof v === 'number' ? v.toFixed(2) : '--'; }

async function fetchDashboard() {
  const r = await fetch(`${API}/dashboard`, {
    headers: { 'x-user-id': userId }
  });
  return r.json();
}

async function fetchHistory(symbol) {
  const r = await fetch(`${API}/market/history/${symbol}?days=7`);
  return r.json();
}

function toggleExpand(symbol) {
  const el = document.getElementById(`hist-${symbol}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
  if (!charts[symbol]) loadChart(symbol);
}

async function loadChart(symbol) {
  const data = await fetchHistory(symbol);
  const labels = data.map(d => new Date(d.created_at).toLocaleDateString());
  const prices = data.map(d => d.price);

  const ctx = document.getElementById(`chart-${symbol}`).getContext('2d');
  charts[symbol] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: prices,
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37,99,235,.15)',
        fill: true,
        tension: .35
      }]
    },
    options: {
      plugins:{legend:{display:false}},
      scales:{x:{display:false}}
    }
  });
}

async function load() {
  const data = await fetchDashboard();
  board.innerHTML = data.map(s => `
    <div class="card">
      <div class="card-header">
        <div class="symbol">${s.symbol}</div>
        <div class="toggle" onclick="toggleMonitor('${s.symbol}')">
          <span>Monitorar</span>
          <div class="switch ${s.monitor?'on':''}"></div>
        </div>
      </div>

      <div class="price">R$ ${fmt(s.price)}</div>
      <div class="variation ${s.variation>=0?'up':'down'}">
        ${s.variation>=0?'+':''}${fmt(s.variation)}%
      </div>

      <div class="expand" onclick="toggleExpand('${s.symbol}')">
        ▾ Ver histórico (7 dias)
      </div>

      <div class="history" id="hist-${s.symbol}">
        <canvas id="chart-${s.symbol}"></canvas>
      </div>
    </div>
  `).join('');
}

async function toggleMonitor(symbol){
  const s = stocks[symbol];
  await fetch(`${API}/monitor`, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-user-id':userId
    },
    body:JSON.stringify({symbol, monitor:!s.monitor})
  });
  load();
}

document.getElementById('logoutBtn').onclick = () => {
  localStorage.clear();
  location.href='/login.html';
};

load();
</script>

</body>
</html>
