<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard Fintech</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #0f172a;
    }

    .topbar {
      height: 64px;
      padding: 0 28px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .welcome {
      font-size: 16px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .btn.primary {
      background: #2563eb;
      color: #ffffff;
      border: none;
    }

    .board {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
      transition: box-shadow 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol {
      font-size: 17px;
      font-weight: 600;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
    }

    .switch {
      width: 36px;
      height: 20px;
      background: #e5e7eb;
      border-radius: 999px;
      position: relative;
    }

    .switch::after {
      content: '';
      width: 16px;
      height: 16px;
      background: #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .switch.on {
      background: #16a34a;
    }

    .switch.on::after {
      transform: translateX(16px);
    }

    .price {
      font-size: 26px;
      font-weight: 600;
      margin-top: 12px;
    }

    .variation {
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }

    .up { color: #16a34a; }
    .down { color: #dc2626; }

    .details {
      margin-top: 14px;
      font-size: 13px;
    }

    .details-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
    }

    .details-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="welcome">Olá, <strong>bem-vindo</strong></div>
    <div class="actions">
      <button class="btn">Conta</button>
      <button class="btn primary">Monitorar</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <script>
    const API_BASE_URL =
      'https://stock-tracker-fintech-backend.watryz.easypanel.host/api';

    let stocks = [];
    const board = document.getElementById('board');

    async function fetchDashboard() {
      const res = await fetch(`${API_BASE_URL}/dashboard`);
      if (!res.ok) throw new Error('Erro ao buscar dashboard');
      return res.json();
    }

    async function loadDashboard() {
      try {
        const { stocks: data } = await fetchDashboard();

        stocks = data.map(item => ({
          symbol: item.symbol,
          price: item.last_price ?? item.close_price ?? item.open_price ?? 0,
          variation: item.variation ?? 0,
          open: item.open_price ?? 0,
          close: item.close_price ?? 0,
          monitor: true
        }));

        render();
      } catch (err) {
        console.error(err);
        board.innerHTML = '<p style="color:red">Erro ao carregar dashboard</p>';
      }
    }

    async function refreshPrices() {
      try {
        const { stocks: data } = await fetchDashboard();

        data.forEach(update => {
          const stock = stocks.find(s => s.symbol === update.symbol);
          if (!stock || !stock.monitor) return;

          stock.price =
            update.last_price ?? update.close_price ?? stock.price;

          stock.variation = update.variation ?? stock.variation;
          stock.open = update.open_price ?? stock.open;
          stock.close = update.close_price ?? stock.close;
        });

        render();
      } catch (err) {
        console.error(err);
      }
    }

    function render() {
      board.innerHTML = stocks.map((s, i) => `
        <div class="card">
          <div class="card-header">
            <div class="symbol">${s.symbol}</div>
            <div class="toggle" onclick="toggleMonitor(${i})">
              <span>Monitorar</span>
              <div class="switch ${s.monitor ? 'on' : ''}"></div>
            </div>
          </div>

          <div class="price">R$ ${s.price.toFixed(2)}</div>

          <div class="variation ${s.variation >= 0 ? 'up' : 'down'}">
            ${s.variation >= 0 ? '+' : ''}${s.variation}%
          </div>

          <div class="details">
            <div class="details-row">
              <span class="label">Abertura</span>
              <span>R$ ${s.open.toFixed(2)}</span>
            </div>
            <div class="details-row">
              <span class="label">Fechamento</span>
              <span>R$ ${s.close.toFixed(2)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleMonitor(i) {
      stocks[i].monitor = !stocks[i].monitor;
      render();
    }

    loadDashboard();
    setInterval(refreshPrices, 60_000);
  </script>

</body>
</html>
