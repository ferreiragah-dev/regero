<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <strong>Perfil</strong>
  <div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="manage.html">Gerenciar</a>
  </div>
</div>

<div class="container">
  <div class="card">
    <label>Nome</label>
    <input id="name"><br><br>

    <label>Email</label>
    <input id="email"><br><br>

    <button class="primary" onclick="save()">Salvar</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  const user = getUser();
  name.value = user.name;
  email.value = user.email;

  function save() {
    saveUser({
      name: name.value,
      email: email.value
    });
    alert('Perfil salvo');
  }
</script>

</body>
</html>
